<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Process Map</title>
<style>
  body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
  #map { flex: 1; overflow: hidden; background: #fafafa; cursor: grab; }
  #map svg { width: 100%; height: 100%; }
  #panel { width: 280px; padding: 1rem; border-left: 1px solid #ccc; overflow: auto; }
  .step { cursor: pointer; }
  .step:hover > :first-child { stroke-width: 3; filter: brightness(0.95); }
  .step.selected > :first-child { stroke: #d33; stroke-width: 3; }
</style>
</head>
<body>
<div id="map" aria-label="Process map"></div>
<aside id="panel">
  <h2 id="title">Process map</h2>
  <p id="desc">Click a step to see details. Scroll to zoom, drag to pan.</p>
  <button id="reset" type="button">Reset view</button>
</aside>
<script>
// Change this to point at your own SVG. Any element with class "step" (or id
// starting with "step-") becomes clickable; use data-title / data-description
// attributes (or <title>/<desc> children) for the detail panel.
const SVG_URL = new URLSearchParams(location.search).get('svg') || 'process-map.svg';

const map = document.getElementById('map');
const title = document.getElementById('title');
const desc = document.getElementById('desc');

fetch(SVG_URL).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(text => {
  map.innerHTML = text;
  const svg = map.querySelector('svg');
  if (!svg) throw new Error('Not an SVG');
  const base = svg.viewBox.baseVal.width
    ? [svg.viewBox.baseVal.x, svg.viewBox.baseVal.y, svg.viewBox.baseVal.width, svg.viewBox.baseVal.height]
    : [0, 0, svg.width.baseVal.value || 1000, svg.height.baseVal.value || 1000];
  let vb = base.slice();
  const apply = () => svg.setAttribute('viewBox', vb.join(' '));
  apply();

  const label = (el, tag, attr) =>
    el.getAttribute(attr) || (el.querySelector(':scope > ' + tag) || {}).textContent || '';

  let selected = null;
  svg.querySelectorAll('.step, [id^="step-"]').forEach(el => {
    el.classList.add('step');
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (dragged) return;
      if (selected) selected.classList.remove('selected');
      selected = el; el.classList.add('selected');
      title.textContent = label(el, 'title', 'data-title') || el.id;
      desc.textContent = label(el, 'desc', 'data-description') || (el.textContent || '').trim();
    });
  });

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 0.9 : 1.1;
    const r = svg.getBoundingClientRect();
    const px = vb[0] + (e.clientX - r.left) / r.width * vb[2];
    const py = vb[1] + (e.clientY - r.top) / r.height * vb[3];
    vb = [px - (px - vb[0]) * f, py - (py - vb[1]) * f, vb[2] * f, vb[3] * f];
    apply();
  }, { passive: false });

  let drag = null, dragged = false;
  svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; dragged = false; });
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = svg.getBoundingClientRect();
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) dragged = true;
    vb[0] -= dx / r.width * vb[2]; vb[1] -= dy / r.height * vb[3];
    drag = { x: e.clientX, y: e.clientY };
    apply();
  });
  window.addEventListener('pointerup', () => { drag = null; setTimeout(() => dragged = false); });

  document.getElementById('reset').onclick = () => { vb = base.slice(); apply(); };
}).catch(err => { map.textContent = 'Could not load ' + SVG_URL + ': ' + err.message; });
</script>
</body>
</html>
