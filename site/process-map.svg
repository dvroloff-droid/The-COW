<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <g id="step-start" class="step" data-title="Start" data-description="A request is received.">
    <rect x="10" y="50" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#336"/><text x="80" y="85" text-anchor="middle">Start</text></g>
  <g id="step-review" class="step" data-title="Review" data-description="The request is reviewed for completeness.">
    <rect x="230" y="50" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#336"/><text x="300" y="85" text-anchor="middle">Review</text></g>
  <g id="step-done" class="step" data-title="Done" data-description="The request is fulfilled and closed.">
    <rect x="450" y="50" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#336"/><text x="520" y="85" text-anchor="middle">Done</text></g>
  <path d="M150 80 H228" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <path d="M370 80 H448" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
</svg>
