name: Diagnose fantasy article formatting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public article formatting
        run: |
          python3 - <<'PY'
          import html.parser
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          config = pathlib.Path("supabase-config.js").read_text()
          base = re.search(r'supabaseUrl:\s*"([^"]+)"', config).group(1)
          key = re.search(r'supabaseAnonKey:\s*"([^"]+)"', config).group(1)
          request = urllib.request.Request(
              base + "/storage/v1/object/list/coach-thoughts",
              data=json.dumps({"prefix": "", "limit": 1000}).encode(),
              headers={"apikey": key, "Content-Type": "application/json"},
          )
          files = json.load(urllib.request.urlopen(request))
          class Inspect(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  self.stack.append((tag, attrs.get("style", ""), attrs.get("size", "")))
              def handle_endtag(self, tag):
                  for i in range(len(self.stack) - 1, -1, -1):
                      if self.stack[i][0] == tag:
                          del self.stack[i:]
                          break
              def handle_data(self, data):
                  if any(phrase in data.lower() for phrase in ("few stories", "sampson", "did yoro", "red card")):
                      print("matching text structure:", self.stack)
          for file in files:
              name = file.get("name", "")
              if not name.startswith("story-fantasy-") or not name.endswith(".json"):
                  continue
              url = base + "/storage/v1/object/public/coach-thoughts/" + urllib.parse.quote(name)
              article = json.load(urllib.request.urlopen(url))
              content = article.get("html", "")
              if "red card" in content.lower():
                  print("Found matching fantasy story")
                  Inspect().feed(content)
          site = urllib.request.urlopen("https://dvroloff-droid.github.io/The-COW/?diagnostic=20261127").read().decode()
          print("Published stylesheet:", re.findall(r"styles\.css\?v=[^\"']+", site))
          PY
      - name: Inspect rendered article
        run: |
          node <<'JS'
          const { spawn } = require("node:child_process");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const profile = fs.mkdtempSync(path.join(os.tmpdir(), "story-chrome-"));
          const chrome = spawn("google-chrome", ["--headless", "--no-sandbox", "--disable-gpu", "--remote-debugging-port=9222", `--user-data-dir=${profile}`, "about:blank"], {stdio: "ignore"});
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            try {
              let targets;
              for (let i = 0; i < 30; i++) {
                try { targets = await (await fetch("http://127.0.0.1:9222/json")).json(); break; }
                catch { await sleep(500); }
              }
              if (!targets) throw new Error("Chrome did not start");
              const socket = new WebSocket(targets[0].webSocketDebuggerUrl);
              await new Promise((resolve, reject) => { socket.onopen = resolve; socket.onerror = reject; });
              let nextId = 0;
              const pending = new Map();
              socket.onmessage = event => {
                const message = JSON.parse(event.data);
                if (!message.id || !pending.has(message.id)) return;
                const [resolve, reject] = pending.get(message.id);
                pending.delete(message.id);
                message.error ? reject(new Error(message.error.message)) : resolve(message.result);
              };
              const send = (method, params = {}) => new Promise((resolve, reject) => {
                const id = ++nextId;
                pending.set(id, [resolve, reject]);
                socket.send(JSON.stringify({id, method, params}));
              });
              await send("Emulation.setDeviceMetricsOverride", {width: 427, height: 900, deviceScaleFactor: 1, mobile: false});
              await send("Page.navigate", {url: "https://dvroloff-droid.github.io/The-COW/?diagnostic=20261127"});
              await sleep(15000);
              const result = await send("Runtime.evaluate", {
                returnByValue: true,
                expression: `(() => {
                  const root = document.querySelector("#fantasy-updates-list");
                  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
                  const out = [];
                  while (walker.nextNode()) {
                    const node = walker.currentNode;
                    if (!/few stories|sampson|did yoro|red card/i.test(node.textContent)) continue;
                    const range = document.createRange();
                    range.selectNodeContents(node);
                    const rect = range.getClientRects()[0];
                    const parents = [];
                    for (let e = node.parentElement; e && e !== root; e = e.parentElement) {
                      const s = getComputedStyle(e);
                      parents.push({tag:e.tagName, class:e.className, inline:e.getAttribute("style"), font:s.fontSize, adjust:s.webkitTextSizeAdjust});
                    }
                    out.push({label: /sampson/i.test(node.textContent) ? "before" : /did yoro/i.test(node.textContent) ? "after" : /few stories/i.test(node.textContent) ? "wrapped" : "red-card", rectHeight:rect?.height, parents});
                  }
                  return {matches:out, storyCount:root.querySelectorAll(".shared-story-body").length, stylesheet:document.querySelector('link[rel="stylesheet"]').href};
                })()`,
              });
              console.log(JSON.stringify(result.result.value));
              socket.close();
            } finally { chrome.kill(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
